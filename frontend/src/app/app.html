<nav>
    <a class="marca" routerLink="/publicaciones">Falsebook</a>
    <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
    <a routerLink="/mi-perfil" routerLinkActive="activo">Mi Perfil</a>

    @if (sesion.obtener(); as usuario) {
    <span>{{ usuario.nombreUsuario }}</span>
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    } @else {
    <a routerLink="/login" routerLinkActive="activo">Login</a>
    <a routerLink="/registro" routerLinkActive="activo">Registro</a>
    }
</nav>

<router-outlet />

<app-modal mensaje="Quedan 5 minutos de sesión. ¿Querés extenderla?" [visible]="sesion.avisoExpiracion()"
    [pedirConfirmacion]="true" textoConfirmar="Extender sesión" (cerrado)="ignorarAviso()"
    (confirmado)="extenderSesion()">
</app-modal>
