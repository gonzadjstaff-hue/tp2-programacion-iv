@if (sesion.cargando()) {
<div class="cargando pantalla-carga">
    <div class="spinner"></div>
    <p>Cargando...</p>
</div>
} @else {
<nav>
    <a class="marca" [routerLink]="sesion.obtener() ? '/publicaciones' : '/login'">Falsebook</a>

    @if (sesion.obtener(); as usuario) {
    <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
    <a routerLink="/mi-perfil" routerLinkActive="activo">Mi Perfil</a>
    <a *appSoloAdmin routerLink="/dashboard/usuarios" routerLinkActive="activo">Usuarios</a>
    <a *appSoloAdmin routerLink="/dashboard/estadisticas" routerLinkActive="activo">Estadísticas</a>
    <span>{{ usuario.nombreUsuario }}</span>
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    } @else {
    <a routerLink="/login" routerLinkActive="activo">Login</a>
    <a routerLink="/registro" routerLinkActive="activo">Registro</a>
    }
</nav>
}

<router-outlet />

<app-modal mensaje="Quedan 1 minuto de sesión. ¿Querés extenderla?" [visible]="sesion.avisoExpiracion()"
    [pedirConfirmacion]="true" textoConfirmar="Extender sesión" (cerrado)="ignorarAviso()"
    (confirmado)="extenderSesion()">
</app-modal>
